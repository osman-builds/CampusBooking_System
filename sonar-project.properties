# =============================================================================
# SonarCloud Project Configuration
# =============================================================================

# Exclude non-code documentation from code analysis
sonar.exclusions=docs/**

# Exclude legacy experimental baseline (codebase_a), Milestone 2 evolutionary CR snapshots,
# and test suite from cross-directory copy-paste duplication checks
sonar.cpd.exclusions=codebase_a/**,cr1_corrective/**,cr2_adaptive/**,cr3_perfective/**,tests/**,docs/**
