name: CI - Campus Booking System Automated Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    name: Run Automated Tests & Validations (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.10", "3.11", "3.12" ]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Validate Codebase A (Monolith) Execution
        run: |
          python codebase_a/booking_system.py

      - name: Validate Codebase B (Clean Architecture) Execution
        run: |
          python codebase_b/main.py

      - name: Validate Refactored Codebase A Execution
        run: |
          python refactored_codebase_a/booking_system.py

      - name: Run Automated Unit & Regression Tests
        run: |
          python -m unittest discover tests -v
